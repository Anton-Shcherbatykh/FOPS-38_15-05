include:
  - ./proxy.yaml

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    restart: always
    depends_on:
      - db
    networks:
      backend:
        ipv4_address: 172.20.0.5
    
  db:
    image: mysql:8
    env_file:
      - .env
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.20.0.10
    healthcheck:
       test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
       interval: 10s
       timeout: 5s
       retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
